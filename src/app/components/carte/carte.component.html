@if (erreur(); as message) {
  <div class="carte-erreur">
    <p>{{ message }}</p>
    <ion-button fill="outline" size="small" (click)="reessayer()" title="Réessayer le chargement de la carte">Réessayer</ion-button>
  </div>
} @else {
  <div #carteEl class="carte-conteneur"></div>

  @if (aucunLieuAffiche()) {
    <div class="carte-etat-vide">
      <p>Aucun lieu ne correspond aux filtres actifs.</p>
      <ion-button fill="outline" size="small" (click)="filtrerFavoris.set(false); filtrerOuverts.set(false)" title="Afficher tous les lieux">Afficher tous les lieux</ion-button>
    </div>
  }

  <button
    class="bouton-favoris"
    [class.bouton-favoris-actif]="filtrerFavoris()"
    (click)="basculerFiltreFavoris()"
    [attr.aria-label]="filtrerFavoris() ? 'Afficher tous les lieux' : 'Afficher seulement mes favoris'"
    [attr.title]="filtrerFavoris() ? 'Afficher tous les lieux' : 'Afficher seulement mes favoris'">
    <ion-icon [name]="filtrerFavoris() ? 'heart' : 'heart-outline'"></ion-icon>
  </button>

  <button
    class="bouton-ouverts"
    [class.bouton-ouverts-actif]="filtrerOuverts()"
    (click)="basculerFiltreOuverts()"
    [attr.aria-label]="filtrerOuverts() ? 'Afficher tous les lieux' : 'Afficher seulement les lieux ouverts'"
    [attr.title]="filtrerOuverts() ? 'Afficher tous les lieux' : 'Afficher seulement les lieux ouverts'">
    <ion-icon name="time-outline"></ion-icon>
  </button>

  @if (position()) {
    <button class="bouton-recentrer" (click)="recentrer()" aria-label="Recentrer sur ma position" title="Recentrer sur ma position">
      <ion-icon name="locate-outline"></ion-icon>
    </button>
  }
}
