name: CI/CD - Build & Deploy Angular via FTP

on:
  push:
    branches:
      - master   # Adaptez à votre branche principale (main, master, prod...)

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'   # Adaptez à la version utilisée par votre projet
          cache: 'npm'

      - name: Installation des dépendances
        run: npm ci

      - name: Build de l'application Angular
        run: npm run build -- --configuration production

      - name: Déploiement via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/japon/    # Chemin généré par le build, à adapter
          server-dir: /

