name: CI/CD - Build & Deploy Angular via FTP

on:
  push:
    branches:
      - master   # Adaptez à votre branche principale (main, master, prod...)

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'   # Adaptez à la version utilisée par votre projet
          cache: 'npm'

      - name: Installation des dépendances
        run: npm ci

      - name: Vérification des types (tsc --noEmit)
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Tests unitaires (headless)
        run: npx ng test --watch=false --browsers=ChromeHeadless

      - name: Build de l'application Angular
        run: npm run build -- --configuration production

      - name: Injection des secrets Cloudflare Access dans le relais IA (public/api/ai.php)
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          python3 - <<'EOF'
          import os
          chemin = "dist/primeng-quickstart/browser/api/ai.php"
          with open(chemin, "r", encoding="utf-8") as f:
              contenu = f.read()
          # Remplacement littéral (pas de regex) : évite tout souci de caractère spécial
          # (&, /, \...) qui pourrait apparaître dans la valeur du secret.
          contenu = contenu.replace("__CF_ACCESS_CLIENT_ID__", os.environ["CF_ACCESS_CLIENT_ID"])
          contenu = contenu.replace("__CF_ACCESS_CLIENT_SECRET__", os.environ["CF_ACCESS_CLIENT_SECRET"])
          with open(chemin, "w", encoding="utf-8") as f:
              f.write(contenu)
          EOF

      - name: Déploiement via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/primeng-quickstart/browser/    # Chemin généré par le build, à adapter
          server-dir: /

